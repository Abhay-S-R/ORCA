[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: Depends(...) in a default arg is FastAPI's own required DI pattern.
# BLE001: Broad except Exception in best-effort cache writes — these must
#   not crash the user-facing request; the alternative is narrower but fragile.
# S110/S112: try-except-pass/continue for the same best-effort writes.
# DTZ007/DTZ011: Naive datetimes in historical replay (Cyclone Gaja 2018) and
#   the fishing-ban date fallback — sources carry no timezone.
# RUF007: zip(x, x[1:]) vs itertools.pairwise() is stylistic.
# UP031: %-format in self-check prints — not worth the churn.
ignore = ["B008", "BLE001", "S110", "S112", "DTZ007", "DTZ011", "RUF007", "UP031"]

[tool.mypy]
ignore_missing_imports = true

# Pyrefly is a THIRD checker, deliberately: it is the analyzer the editor's
# Pyrefly extension runs, so without this section CI cannot reproduce a
# squiggle a dev sees in their IDE. It caught one real error mypy and ruff
# both passed (graph.py's `update` dict literal widening `disclosures` to
# list[dict | str]). Without an explicit section it silently imports
# [tool.mypy] under a "legacy" preset, which is a setting that can change
# under us; pinning it here means the gate means the same thing every run.
[tool.pyrefly]
project-includes = ["orca"]
ignore-missing-imports = ["*"]
