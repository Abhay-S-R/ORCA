name: CI

# Manual only. data/ is gitignored, so a hosted runner has no Tier-1
# fixtures and the backend suite cannot pass there; pytest runs locally
# instead. Trigger from Actions > CI > Run workflow when you want it.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: mypy orca
      - run: pytest -q

      # plan P0.12 / R-JUDGE-4 — one source of truth for all CI guards
      # (vendor SDK import, persona leak, secret scan, safety-path LLM
      # import), instead of re-implementing a subset of them as inline
      # greps that silently drift from scripts/verify_ci_guards.py.
      - name: CI guards (vendor SDK, persona leak, secret scan, safety-path LLM import)
        run: python scripts/verify_ci_guards.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # plan §6 D1 Day 21 — a11y CI gate. D1 owns the harness (playwright.config.ts,
      # e2e/a11y.spec.ts) and audits its own flows (Ask `/`, Safety `/safety`);
      # D2/D3 add their own spec files against the same AxeBuilder for
      # /watches, /ops, /map, /voyage, /reasoning.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y:e2e
