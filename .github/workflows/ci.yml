name: CI — Lint

# Gating on every push and PR to main. The full `pytest` suite deliberately
# stays out of CI because data/ is gitignored and a hosted runner has no Tier-1
# fixtures; the one data-free test file (the response guarantee) runs below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend lint (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
      - name: Ruff (all Python files)
        run: ruff check .

      # The repo-root scripts/ directory — the data-refresh jobs — is outside
      # this job's working-directory, so it was never linted at all. That gap
      # is how fourteen copies of the same EXE001 shebang problem sat unseen
      # until one of them happened to live under backend/. The rule set comes
      # from the root ruff.toml, which extends backend/pyproject.toml, so this
      # step and a dev's local `ruff check .` agree.
      - name: Ruff (repo-root scripts/ — the data-refresh jobs)
        working-directory: .
        run: ruff check scripts/
      - name: Mypy (type check)
        run: mypy orca --ignore-missing-imports

      # A third checker on purpose. Pyrefly is the analyzer the editor's
      # Pyrefly extension runs, so without this step CI cannot reproduce a
      # squiggle a dev sees in their IDE — and it is not redundant with mypy:
      # it caught a real graph.py error (`disclosures` widened to
      # list[dict | str]) that both ruff and mypy passed. Settings live in
      # backend/pyproject.toml's [tool.pyrefly] so the gate means the same
      # thing here and on a dev's machine.
      - name: Pyrefly (type check — the checker the IDE runs)
        run: pyrefly check

      # plan P0.12 / R-JUDGE-4 — one source of truth for all CI guards
      # (vendor SDK import, persona leak, secret scan, safety-path LLM
      # import), instead of re-implementing a subset of them as inline
      # greps that silently drift from scripts/verify_ci_guards.py.
      - name: CI guards (vendor SDK, persona leak, secret scan, safety-path LLM import)
        run: python scripts/verify_ci_guards.py

      # Chatbot plan C0.2(f) — every prompt that reaches /ask gets a written
      # answer, even with every provider down. The one pytest file in CI, and
      # deliberately so: it needs no data/, no network and no key (providers
      # are scripted fakes), so the gate means the same thing on a runner as
      # on a dev machine. Gates at zero failures.
      - name: Response guarantee (every prompt gets a written answer)
        run: python -m pytest -q tests/unit/test_response_guarantee.py

      # Prompt Routing Revamp §7.6 — messy-prompt test harness.
      # Runs with ORCA_LLM_ENABLED=0 to test the deterministic fallback
      # (word lists → Understand fallback). Gates at zero failures.
      - name: Prompt routing — messy prompts (fallback mode)
        run: python -m pytest -q tests/test_messy_prompts.py

  frontend-lint:
    name: Frontend lint (ESLint + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (all files)
        run: npm run lint
      - name: TypeScript type check
        run: npx tsc --noEmit
      # Every dictionary carries every key en.json has (README "Quality gates" lists this).
      - name: i18n dictionaries match English
        run: npm run check:i18n
      # A translated answer must never render blank on the card (2026-10-07: the
      # "GO: reason" split swallowed whole Kannada/Tamil/Hindi answers).
      - name: Verdict header never hides the answer
        run: npm run check:verdict-header
