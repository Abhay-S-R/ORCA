name: Deploy Backend to Render

# Deploys code changes to Render whenever backend code is pushed to main.
# Reuses the existing multi-GB data/ layer from Docker Hub so CI stays fast
# without needing gitignored data/ on the GitHub Actions runner.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/render/**'
      - 'scripts/refresh_fishing_ban_order.py'
      - '.github/workflows/deploy-render.yml'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    name: Build & Deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull or prepare base image (with baked /data)
        run: |
          IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/orca-backend:data-base"
          IMAGE_RENDER="${{ secrets.DOCKERHUB_USERNAME }}/orca-backend:render"

          echo "Checking for clean base image: $IMAGE_BASE..."
          if docker pull "$IMAGE_BASE"; then
            echo "Successfully pulled base image: $IMAGE_BASE"
          else
            echo "Base image $IMAGE_BASE not found or unpullable."
            echo "Recovering and squashing existing $IMAGE_RENDER using crane (bypasses overlay2 depth limits)..."

            # Download crane (standalone container registry tool)
            curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz | tar -xz crane
            chmod +x crane
            ./crane auth login index.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"

            echo "Exporting flattened filesystem and importing as 1-layer base image..."
            ./crane export "$IMAGE_RENDER" - | docker import \
              --change "WORKDIR /app" \
              --change "ENV MALLOC_ARENA_MAX=2" \
              --change "ENV ORCA_LOCAL_MODELS=0" \
              --change "EXPOSE 8000" \
              --change 'CMD ["sh", "-c", "exec uvicorn orca.api.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-graceful-shutdown 3"]' \
              - "$IMAGE_BASE"

            echo "Pushing freshly squashed base image to Docker Hub..."
            docker push "$IMAGE_BASE"
          fi

      - name: Patch updated code onto image
        run: |
          IMAGE_BASE="${{ secrets.DOCKERHUB_USERNAME }}/orca-backend:data-base"
          IMAGE_RENDER="${{ secrets.DOCKERHUB_USERNAME }}/orca-backend:render"

          # Build a lightweight patch layer on top of data-base.
          # Building FROM data-base guarantees layers never accumulate over time,
          # because CI only ever writes to $IMAGE_RENDER and leaves $IMAGE_BASE unchanged.
          cat << 'EOF' > Dockerfile.patch
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          WORKDIR /app
          COPY backend/requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY backend/orca ./orca
          COPY scripts/refresh_fishing_ban_order.py /scripts/
          ENV MALLOC_ARENA_MAX=2
          ENV ORCA_LOCAL_MODELS=0
          EXPOSE 8000
          CMD ["sh", "-c", "exec uvicorn orca.api.main:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-graceful-shutdown 3"]
          EOF

          docker build --build-arg BASE_IMAGE="$IMAGE_BASE" -f Dockerfile.patch -t "$IMAGE_RENDER" .

      - name: Push updated image to Docker Hub
        run: |
          echo "Pushing updated code image to Docker Hub..."
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/orca-backend:render

      - name: Trigger Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render redeployment..."
          if [ -z "$RENDER_HOOK" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK is not set or empty! Check GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          RESPONSE=$(curl -sS -w "\n%{http_code}" -X POST "$RENDER_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Render response (HTTP $HTTP_STATUS): $BODY"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Render deploy triggered successfully!"

